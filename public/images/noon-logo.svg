<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arabic Noon emblem badge -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="#1C1C20" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="40" cy="40" r="34" fill="#24242A" stroke="#374151" stroke-width="1" stroke-dasharray="2 2" />
    <!-- Arabic letter Noon ن -->
    <path d="M 27 38 C 27 52, 53 52, 53 38" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Dot of Noon -->
    <circle cx="40" cy="31" r="3.2" fill="#F59E0B" filter="url(#glow)" />
  </g>
  
  <!-- Brand text -->
  <text x="102" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="2">NOON</text>
  <text x="195" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="24" fill="url(#goldGrad)" letter-spacing="3">CAFE</text>
  
  <!-- Subtext -->
  <text x="104" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="11" fill="#9CA3AF" letter-spacing="3">KISMATPUR • HYDERABAD</text>
</svg>
